<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DynamicShop — Sàn Giao Dịch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-date-fns/3.0.0/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg-void:      #0a0d12;
    --bg-panel:     #11151c;
    --bg-panel-2:   #161b24;
    --line:         #232a36;
    --line-soft:    #1a2028;
    --text-hi:      #e7ecf3;
    --text-mid:     #8b95a7;
    --text-low:     #4d5667;
    --up:           #3ddc84;
    --up-dim:       #1d4a32;
    --down:         #ff5c5c;
    --down-dim:     #4a1d1d;
    --gold:         #f0b94d;
    --diamond:      #5ec8e0;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-void);
    color: var(--text-hi);
    font-family: var(--mono);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(94,200,224,0.04), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(240,185,77,0.04), transparent 40%);
  }

  /* ── Top ticker bar ──────────────────────────────────────── */
  .ticker-bar {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    white-space: nowrap;
    padding: 8px 0;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .ticker-track {
    display: inline-flex;
    gap: 32px;
    animation: scroll-ticker 40s linear infinite;
    padding-left: 100%;
  }
  @keyframes scroll-ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }
  .ticker-item { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .ticker-item .sym { color: var(--text-mid); font-weight: 600; }
  .ticker-item .val { color: var(--text-hi); font-weight: 600; }
  .ticker-item .chg.up { color: var(--up); }
  .ticker-item .chg.down { color: var(--down); }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    padding: 28px 32px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--gold), #c98f1f);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; font-size: 17px;
    color: #1a1408;
    transform: rotate(-4deg);
  }
  .brand h1 {
    font-family: var(--display);
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand .sub { color: var(--text-low); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

  .conn-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-mid); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-low); }
  .dot.live { background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── Layout ───────────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 1px;
    background: var(--line);
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
  }

  .main-col, .side-col { background: var(--bg-void); }

  /* ── Item grid ────────────────────────────────────────────── */
  .section-label {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-low); padding: 20px 32px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--line);
    margin: 0 32px 24px;
    border: 1px solid var(--line);
  }
  .item-card {
    background: var(--bg-panel);
    padding: 16px;
    cursor: pointer;
    transition: background 0.15s ease;
    position: relative;
  }
  .item-card:hover { background: var(--bg-panel-2); }
  .item-card.selected { background: var(--bg-panel-2); box-shadow: inset 2px 0 0 var(--gold); }
  .item-card .name { font-size: 13px; font-weight: 600; color: var(--text-hi); margin-bottom: 2px; }
  .item-card .mat { font-size: 10px; color: var(--text-low); margin-bottom: 10px; letter-spacing: 0.04em; }
  .item-card .price-row { display: flex; justify-content: space-between; align-items: baseline; }
  .item-card .price { font-family: var(--display); font-size: 17px; font-weight: 700; }
  .item-card .chg { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
  .chg.up { color: var(--up); background: var(--up-dim); }
  .chg.down { color: var(--down); background: var(--down-dim); }
  .chg.flat { color: var(--text-mid); background: var(--line-soft); }
  .item-card .spark { height: 24px; margin-top: 8px; }

  /* ── Chart panel ──────────────────────────────────────────── */
  .chart-panel { margin: 0 32px 24px; border: 1px solid var(--line); background: var(--bg-panel); }
  .chart-head {
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .chart-title { display: flex; align-items: baseline; gap: 14px; }
  .chart-title .name { font-family: var(--display); font-size: 19px; font-weight: 700; }
  .chart-title .price { font-size: 22px; font-weight: 700; font-family: var(--display); }
  .chart-title .chg-pill { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 4px; }

  .range-toggle { display: flex; gap: 4px; background: var(--bg-void); padding: 3px; border-radius: 5px; }
  .range-toggle button {
    background: transparent; border: none; color: var(--text-mid);
    font-family: var(--mono); font-size: 11.5px; padding: 5px 11px;
    border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }
  .range-toggle button.active { background: var(--bg-panel-2); color: var(--text-hi); }
  .range-toggle button:hover:not(.active) { color: var(--text-hi); }

  .chart-body { padding: 16px 20px 20px; height: 340px; }

  .stat-strip { display: flex; gap: 0; border-top: 1px solid var(--line); }
  .stat-cell { flex: 1; padding: 12px 20px; border-right: 1px solid var(--line); }
  .stat-cell:last-child { border-right: none; }
  .stat-cell .lbl { font-size: 10px; color: var(--text-low); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .stat-cell .val { font-size: 13.5px; font-weight: 600; }

  /* ── Side panels ──────────────────────────────────────────── */
  .panel { border-bottom: 1px solid var(--line); }
  .panel-head {
    padding: 16px 20px 12px; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-low); font-weight: 600;
  }

  .mover-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; border-top: 1px solid var(--line-soft);
    font-size: 12.5px;
  }
  .mover-row:first-of-type { border-top: none; }
  .mover-rank { color: var(--text-low); width: 18px; }
  .mover-name { flex: 1; color: var(--text-hi); font-weight: 500; }

  .tx-row {
    padding: 10px 20px; border-top: 1px solid var(--line-soft);
    font-size: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .tx-row:first-of-type { border-top: none; }
  .tx-type { font-weight: 700; font-size: 10px; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.04em; }
  .tx-type.buy { color: var(--down); background: var(--down-dim); }
  .tx-type.sell { color: var(--up); background: var(--up-dim); }
  .tx-meta { color: var(--text-mid); font-size: 11px; }
  .tx-time { color: var(--text-low); font-size: 10.5px; }

  /* ── Admin panel ──────────────────────────────────────────── */
  .admin-fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg-panel-2); border: 1px solid var(--line);
    color: var(--text-mid); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; z-index: 100;
    transition: all 0.15s;
  }
  .admin-fab:hover { color: var(--gold); border-color: var(--gold); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,7,10,0.8);
    display: none; align-items: center; justify-content: center; z-index: 200;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--line);
    width: 340px; padding: 24px;
  }
  .modal h3 { font-family: var(--display); font-size: 16px; margin-bottom: 16px; }
  .modal label { font-size: 11px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; margin-top: 14px; }
  .modal input, .modal select {
    width: 100%; background: var(--bg-void); border: 1px solid var(--line);
    color: var(--text-hi); padding: 9px 10px; font-family: var(--mono); font-size: 13px;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--gold); }
  .modal .btn-row { display: flex; gap: 8px; margin-top: 20px; }
  .modal button.action {
    flex: 1; padding: 10px; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; font-weight: 600;
  }
  .btn-primary { background: var(--gold); color: #1a1408; }
  .btn-ghost { background: transparent; color: var(--text-mid); border: 1px solid var(--line) !important; }
  .modal .err { color: var(--down); font-size: 11.5px; margin-top: 10px; min-height: 14px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-void); }
  ::-webkit-scrollbar-thumb { background: var(--line); }

  .empty-state { padding: 30px 20px; text-align: center; color: var(--text-low); font-size: 12px; }
</style>
</head>
<body>

  <div class="ticker-bar">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <header>
    <div class="brand">
      <div class="brand-mark">$</div>
      <div>
        <h1>DynamicShop Exchange</h1>
        <div class="sub">Thị Trường Vật Phẩm Theo Thời Gian Thực</div>
      </div>
    </div>
    <div class="conn-status">
      <span class="dot" id="connDot"></span>
      <span id="connText">Đang kết nối...</span>
    </div>
  </header>

  <div class="layout">
    <div class="main-col">

      <div class="chart-panel">
        <div class="chart-head">
          <div class="chart-title">
            <span class="name" id="chartItemName">—</span>
            <span class="price" id="chartItemPrice">$0.00</span>
            <span class="chg-pill" id="chartItemChg">0.0%</span>
          </div>
          <div class="range-toggle" id="rangeToggle">
            <button data-hours="1">1G</button>
            <button data-hours="6">6G</button>
            <button data-hours="24" class="active">24G</button>
            <button data-hours="168">7N</button>
          </div>
        </div>
        <div class="chart-body">
          <canvas id="priceChart"></canvas>
        </div>
        <div class="stat-strip">
          <div class="stat-cell">
            <div class="lbl">Giá Mua</div>
            <div class="val" id="statBuy">$0.00</div>
          </div>
          <div class="stat-cell">
            <div class="lbl">Giá Bán</div>
            <div class="val" id="statSell">$0.00</div>
          </div>
          <div class="stat-cell">
            <div class="lbl">Tổng Đã Mua</div>
            <div class="val" id="statBought">0</div>
          </div>
          <div class="stat-cell">
            <div class="lbl">Tổng Đã Bán</div>
            <div class="val" id="statSold">0</div>
          </div>
        </div>
      </div>

      <div class="section-label">
        <span>Tất Cả Vật Phẩm</span>
        <span id="itemCount">0 items</span>
      </div>
      <div class="item-grid" id="itemGrid"></div>

    </div>

    <div class="side-col">
      <div class="panel">
        <div class="panel-head">📈 Biến Động Mạnh Nhất</div>
        <div id="topMovers"><div class="empty-state">Đang tải...</div></div>
      </div>
      <div class="panel">
        <div class="panel-head">⚡ Giao Dịch Gần Đây</div>
        <div id="recentTx"><div class="empty-state">Đang tải...</div></div>
      </div>
    </div>
  </div>

  <div class="admin-fab" id="adminFab" title="Admin Panel">⚙</div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="loginModal">
      <h3>Đăng Nhập Admin</h3>
      <label>Mật khẩu</label>
      <input type="password" id="adminPassword" placeholder="••••••••">
      <div class="err" id="loginErr"></div>
      <div class="btn-row">
        <button class="action btn-ghost" id="cancelLogin">Hủy</button>
        <button class="action btn-primary" id="submitLogin">Đăng nhập</button>
      </div>
    </div>

    <div class="modal" id="priceModal" style="display:none;">
      <h3>Đổi Giá Thủ Công</h3>
      <label>Vật phẩm</label>
      <select id="priceItemSelect"></select>
      <label>Giá mua mới</label>
      <input type="number" id="newBuyPrice" step="0.01">
      <label>Giá bán mới</label>
      <input type="number" id="newSellPrice" step="0.01">
      <div class="err" id="priceErr"></div>
      <div class="btn-row">
        <button class="action btn-ghost" id="closePriceModal">Đóng</button>
        <button class="action btn-primary" id="submitPrice">Cập Nhật Giá</button>
      </div>
    </div>
  </div>

<script src="/app.js"></script>
</body>
</html>
